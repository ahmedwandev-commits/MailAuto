<!doctype html>
<html lang="{{ lang or 'en' }}" dir="{{ text_dir or 'ltr' }}"{% if lang == 'ar' %} class="i18n-pending"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}IAS Portal{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='nbe-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='i18n.css') }}">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  {% if lang == 'ar' %}{# Arabic: the dictionary and the translator run before the page is shown (no flash of English) #}
  <script src="{{ url_for('static', filename='i18n-ar.js') }}"></script>
  <script src="{{ url_for('static', filename='i18n.js') }}"></script>{% endif %}
  <script defer src="{{ url_for('static', filename='network-bg.js') }}"></script>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='theme-gold.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
